name: Keep Supabase alive

# Free-plan Supabase projects pause after 7 days without activity.
# This runs a tiny read-only query every 3 days so the project never goes idle.

on:
  schedule:
    - cron: "0 3 */3 * *" # 03:00 UTC every 3rd day
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/units?select=code&limit=1" \
            -H "apikey: $SUPABASE_SECRET_KEY"
